name: islamic_tracker
description: Daily Islamic Worship Tracker - تتبع العبادات اليومية

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Local storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3
  flutter_timezone: ^1.0.7

  # Prayer times
  adhan: ^1.1.0

  # UI
  fl_chart: ^0.67.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
